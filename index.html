<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوتيوب - YouTube Clone (Connected to API)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        youtube: {
                            red: '#FF0000',
                            dark: '#0f0f0f',
                            sidebar: '#212121',
                            card: '#1f1f1f',
                            border: '#3f3f3f'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f3f;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Base URL (قم بتغييره إلى رابط السيرفر المجاني بعد الرفع على Render)
        const API_URL = 'http://localhost:5000/api';

        const categories = ['الكل', 'برمجة', 'تقنية', 'موسيقى', 'ألعاب', 'طبخ', 'طبيعة', 'رياضة', 'أفلام', 'بودكاست', 'كوميديا', 'تعليم'];

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [selectedVideo, setSelectedVideo] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('الكل');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [videos, setVideos] = useState([]);
            const [comments, setComments] = useState([]);
            const [newCommentText, setNewCommentText] = useState('');
            const [isSubscribed, setIsSubscribed] = useState(false);
            const [likesCount, setLikesCount] = useState(0);
            const [isLiked, setIsLiked] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [serverStatus, setServerStatus] = useState('جاري الاتصال بالسيرفر...');

            // Fetch Videos from Backend API
            useEffect(() => {
                fetchVideos();
            }, [searchQuery, selectedCategory]);

            const fetchVideos = async () => {
                setIsLoading(true);
                try {
                    let url = `${API_URL}/videos?`;
                    if (searchQuery) url += `search=${encodeURIComponent(searchQuery)}&`;
                    if (selectedCategory && selectedCategory !== 'الكل') url += `category=${encodeURIComponent(selectedCategory)}`;

                    const res = await fetch(url);
                    const data = await res.json();
                    setVideos(data);
                    setServerStatus('متصل بالسيرفر بنجاح 🟢');
                } catch (err) {
                    console.error('Error fetching videos:', err);
                    setServerStatus('تعذر الاتصال بالسيرفر (تأكد من تشغيل server.js) 🔴');
                } finally {
                    setIsLoading(false);
                }
            };

            // Fetch comments when video selected
            useEffect(() => {
                if (selectedVideo) {
                    fetchComments(selectedVideo.id);
                    setLikesCount(selectedVideo.likes);
                    setIsLiked(false);
                    setIsSubscribed(false);
                }
            }, [selectedVideo]);

            const fetchComments = async (videoId) => {
                try {
                    const res = await fetch(`${API_URL}/videos/${videoId}/comments`);
                    const data = await res.json();
                    setComments(data);
                } catch (err) {
                    console.error('Error fetching comments:', err);
                }
            };

            const handleVideoClick = (video) => {
                setSelectedVideo(video);
                setCurrentView('watch');
                window.scrollTo(0, 0);
            };

            const handleAddComment = async (e) => {
                e.preventDefault();
                if (!newCommentText.trim() || !selectedVideo) return;

                try {
                    const res = await fetch(`${API_URL}/videos/${selectedVideo.id}/comments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: newCommentText, user: 'مستخدم يوتيوب' })
                    });
                    const newComment = await res.json();
                    setComments([newComment, ...comments]);
                    setNewCommentText('');
                } catch (err) {
                    console.error('Error adding comment:', err);
                }
            };

            const handleLike = async () => {
                if (!selectedVideo) return;
                try {
                    const res = await fetch(`${API_URL}/videos/${selectedVideo.id}/like`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    setLikesCount(data.likes);
                    setIsLiked(!isLiked);
                } catch (err) {
                    console.error('Error liking video:', err);
                }
            };

            return (
                <div className="min-h-screen bg-[#0f0f0f] text-white flex flex-col">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-[#0f0f0f] flex items-center justify-between px-4 h-14 border-b border-[#272727]">
                        <div className="flex items-center gap-4">
                            <button
                                onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                className="p-2 hover:bg-[#272727] rounded-full transition"
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path>
                                </svg>
                            </button>
                            <div
                                onClick={() => { setCurrentView('home'); setSelectedVideo(null); }}
                                className="flex items-center gap-1 cursor-pointer"
                            >
                                <div className="bg-red-600 text-white px-2 py-1 rounded-lg flex items-center justify-center font-bold tracking-wider">
                                    ▶
                                </div>
                                <span className="text-xl font-bold tracking-tighter">YouTube <span className="text-xs text-neutral-400 font-normal">API Connected</span></span>
                            </div>
                        </div>

                        {/* Search Bar */}
                        <div className="flex items-center flex-1 max-w-2xl mx-4">
                            <div className="flex items-center flex-1 bg-[#121212] border border-[#303030] rounded-r-full px-4 py-2 focus-within:border-blue-500">
                                <input
                                    type="text"
                                    placeholder="بحث في الفيديوهات..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-transparent outline-none text-white placeholder-neutral-400 text-sm"
                                    onKeyDown={(e) => { if(e.key === 'Enter') fetchVideos(); }}
                                />
                            </div>
                            <button
                                onClick={fetchVideos}
                                className="bg-[#222222] border border-r-0 border-[#303030] px-6 py-2 rounded-l-full hover:bg-[#303030] transition flex items-center justify-center"
                            >
                                <svg className="w-5 h-5 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </button>
                        </div>

                        {/* Server Status Badge */}
                        <div className="text-xs px-3 py-1 rounded-full bg-[#222] border border-[#333] hidden md:block">
                            {serverStatus}
                        </div>
                    </header>

                    {/* Body layout */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar */}
                        <aside className={`bg-[#0f0f0f] transition-all duration-300 overflow-y-auto ${isSidebarOpen ? 'w-64 p-3' : 'w-20 p-2'} flex-shrink-0 border-r border-[#272727]`}>
                            <div className="space-y-1">
                                <div
                                    onClick={() => { setCurrentView('home'); setSelectedVideo(null); }}
                                    className={`flex ${isSidebarOpen ? 'items-center gap-6 px-4 py-2.5' : 'flex-col items-center justify-center py-3'} rounded-xl hover:bg-[#272727] cursor-pointer transition`}
                                >
                                    <svg className="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                                    <span className={`${isSidebarOpen ? 'text-sm font-medium' : 'text-[10px] mt-1'}`}>الرئيسية</span>
                                </div>
                                <div className={`flex ${isSidebarOpen ? 'items-center gap-6 px-4 py-2.5' : 'flex-col items-center justify-center py-3'} rounded-xl hover:bg-[#272727] cursor-pointer transition`}>
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    <span className={`${isSidebarOpen ? 'text-sm font-medium' : 'text-[10px] mt-1'}`}>Shorts</span>
                                </div>
                                <div className={`flex ${isSidebarOpen ? 'items-center gap-6 px-4 py-2.5' : 'flex-col items-center justify-center py-3'} rounded-xl hover:bg-[#272727] cursor-pointer transition`}>
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    <span className={`${isSidebarOpen ? 'text-sm font-medium' : 'text-[10px] mt-1'}`}>الاشتراكات</span>
                                </div>
                            </div>
                        </aside>

                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto bg-[#0f0f0f] p-6">
                            {currentView === 'home' && (
                                <div>
                                    {/* Categories filter */}
                                    <div className="flex items-center gap-3 overflow-x-auto pb-4 mb-6 scrollbar-none">
                                        {categories.map((cat, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap transition ${
                                                    selectedCategory === cat
                                                        ? 'bg-white text-black font-semibold'
                                                        : 'bg-[#272727] text-white hover:bg-[#3f3f3f]'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Loading State */}
                                    {isLoading && (
                                        <div className="flex justify-center items-center py-20 text-neutral-400">
                                            <p>جاري تحميل الفيديوهات من السيرفر...</p>
                                        </div>
                                    )}

                                    {/* Video Grid */}
                                    {!isLoading && (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                            {videos.map(video => (
                                                <div
                                                    key={video.id}
                                                    onClick={() => handleVideoClick(video)}
                                                    className="cursor-pointer group flex flex-col gap-2"
                                                >
                                                    <div className="relative aspect-video rounded-xl overflow-hidden bg-[#222]">
                                                        <img
                                                            src={video.thumbnail}
                                                            alt={video.title}
                                                            className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                                                        />
                                                        <span className="absolute bottom-2 left-2 bg-black/80 text-white text-xs px-1.5 py-0.5 rounded font-mono">
                                                            {video.duration}
                                                        </span>
                                                    </div>
                                                    <div className="flex gap-3 mt-1">
                                                        <img
                                                            src={video.avatar}
                                                            alt={video.channel}
                                                            className="w-9 h-9 rounded-full object-cover flex-shrink-0"
                                                        />
                                                        <div className="flex flex-col flex-1">
                                                            <h3 className="text-sm font-semibold text-white line-clamp-2 leading-snug group-hover:text-blue-400 transition">
                                                                {video.title}
                                                            </h3>
                                                            <span className="text-xs text-neutral-400 mt-1 hover:text-white transition">
                                                                {video.channel}
                                                            </span>
                                                            <div className="flex items-center gap-1 text-xs text-neutral-400 mt-0.5">
                                                                <span>{video.views}</span>
                                                                <span>•</span>
                                                                <span>{video.timestamp}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {!isLoading && videos.length === 0 && (
                                        <div className="flex flex-col items-center justify-center py-20 text-neutral-400">
                                            <p className="text-lg">لا توجد فيديوهات. تأكد من عمل السيرفر الخلفي (server.js)</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentView === 'watch' && selectedVideo && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
                                    {/* Video Player & Details */}
                                    <div className="lg:col-span-2 space-y-4">
                                        <div className="aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative">
                                            <video
                                                src={selectedVideo.videoUrl}
                                                controls
                                                autoPlay
                                                className="w-full h-full object-contain"
                                            ></video>
                                        </div>

                                        <h1 className="text-xl font-bold leading-tight">
                                            {selectedVideo.title}
                                        </h1>

                                        {/* Channel info and Actions */}
                                        <div className="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-[#272727]">
                                            <div className="flex items-center gap-3">
                                                <img
                                                    src={selectedVideo.avatar}
                                                    alt={selectedVideo.channel}
                                                    className="w-11 h-11 rounded-full object-cover"
                                                />
                                                <div>
                                                    <h3 className="font-bold text-sm">{selectedVideo.channel}</h3>
                                                    <span className="text-xs text-neutral-400">{selectedVideo.subscribers} مشترك</span>
                                                </div>
                                                <button
                                                    onClick={() => setIsSubscribed(!isSubscribed)}
                                                    className={`mr-4 px-4 py-2 rounded-full font-semibold text-sm transition ${
                                                        isSubscribed
                                                            ? 'bg-[#272727] text-white hover:bg-[#3f3f3f]'
                                                            : 'bg-white text-black hover:bg-neutral-200'
                                                    }`}
                                                >
                                                    {isSubscribed ? 'مشترك ✓' : 'اشتراك'}
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <div className="flex items-center bg-[#272727] rounded-full overflow-hidden">
                                                    <button
                                                        onClick={handleLike}
                                                        className={`flex items-center gap-2 px-4 py-2 hover:bg-[#3f3f3f] transition text-sm font-semibold border-l border-[#3f3f3f] ${isLiked ? 'text-blue-400' : ''}`}
                                                    >
                                                        <svg className="w-5 h-5" fill={isLiked ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
                                                        <span>{likesCount}</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Description box */}
                                        <div className="bg-[#222222] p-4 rounded-xl text-sm space-y-2">
                                            <div className="flex items-center gap-3 font-semibold text-xs text-neutral-300">
                                                <span>{selectedVideo.views}</span>
                                                <span>{selectedVideo.timestamp}</span>
                                                <span className="bg-neutral-700 px-2 py-0.5 rounded text-white">{selectedVideo.category}</span>
                                            </div>
                                            <p className="text-neutral-200 leading-relaxed whitespace-pre-line">
                                                {selectedVideo.description}
                                            </p>
                                        </div>

                                        {/* Comments Section */}
                                        <div className="space-y-4 pt-4">
                                            <h3 className="text-lg font-bold">{comments.length} تعليقات</h3>

                                            {/* Add Comment Input */}
                                            <form onSubmit={handleAddComment} className="flex gap-4 items-start">
                                                <img
                                                    src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80"
                                                    alt="User"
                                                    className="w-10 h-10 rounded-full object-cover"
                                                />
                                                <div className="flex-1 space-y-2">
                                                    <input
                                                        type="text"
                                                        placeholder="إضافة تعليق..."
                                                        value={newCommentText}
                                                        onChange={(e) => setNewCommentText(e.target.value)}
                                                        className="w-full bg-transparent border-b border-[#3f3f3f] pb-1 text-sm focus:border-white outline-none"
                                                    />
                                                    <div className="flex justify-end gap-2">
                                                        <button
                                                            type="button"
                                                            onClick={() => setNewCommentText('')}
                                                            className="px-4 py-2 text-xs font-semibold hover:bg-[#272727] rounded-full transition"
                                                        >
                                                            إلغاء
                                                        </button>
                                                        <button
                                                            type="submit"
                                                            className="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 rounded-full transition disabled:opacity-50"
                                                            disabled={!newCommentText.trim()}
                                                        >
                                                            تعليق
                                                        </button>
                                                    </div>
                                                </div>
                                            </form>

                                            {/* Comments List */}
                                            <div className="space-y-4 pt-2">
                                                {comments.map(comment => (
                                                    <div key={comment.id} className="flex gap-4">
                                                        <img src={comment.avatar} alt={comment.user} className="w-10 h-10 rounded-full object-cover" />
                                                        <div className="space-y-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-semibold text-xs">{comment.user}</span>
                                                                <span className="text-[10px] text-neutral-400">{comment.time}</span>
                                                            </div>
                                                            <p className="text-sm text-neutral-200">{comment.text}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Sidebar Recommendations */}
                                    <div className="space-y-3">
                                        <h3 className="font-bold text-base mb-2">فيديوهات مقترحة</h3>
                                        {videos.filter(v => v.id !== selectedVideo.id).map(video => (
                                            <div
                                                key={video.id}
                                                onClick={() => handleVideoClick(video)}
                                                className="flex gap-2 cursor-pointer group"
                                            >
                                                <div className="relative w-40 aspect-video rounded-lg overflow-hidden bg-[#222] flex-shrink-0">
                                                    <img src={video.thumbnail} alt={video.title} className="w-full h-full object-cover group-hover:scale-105 transition" />
                                                    <span className="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1 rounded font-mono">{video.duration}</span>
                                                </div>
                                                <div className="flex flex-col flex-1">
                                                    <h4 className="text-xs font-semibold line-clamp-2 group-hover:text-blue-400 transition leading-snug">{video.title}</h4>
                                                    <span className="text-[11px] text-neutral-400 mt-1">{video.channel}</span>
                                                    <span className="text-[11px] text-neutral-400">{video.views} • {video.timestamp}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
